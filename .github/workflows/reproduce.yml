name: Reproduce Dastan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned environment
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -v
      - name: Verify released datasets
        run: python -m dastan.datasets verify
      - name: Verify FPL-to-Understat mapping
        run: python -m dastan.mappings
      - name: Verify released weights
        run: python -m dastan.verify
      - name: Reproduce released model
        run: python -m dastan.reproduce --n-jobs 2
